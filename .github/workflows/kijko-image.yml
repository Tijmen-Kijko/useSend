name: Kijko UseSend Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kijko-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable amd64 image
    if: github.repository == 'Tijmen-Kijko/useSend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.release.outputs.digest }}
      image: ${{ steps.release.outputs.image }}

    env:
      IMAGE_NAME: ghcr.io/tijmen-kijko/usesend
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing SHA tag
        id: existing
        shell: bash
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ref="${IMAGE_NAME}:${IMAGE_TAG}"

          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "SHA tag already exists; validating that it belongs to this commit."

            docker pull --platform linux/amd64 "$ref" >/dev/null
            revision="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

            if [[ "$revision" != "$GIT_SHA" ]]; then
              echo "::error::Existing immutable tag $ref has revision '$revision', expected '$GIT_SHA'. Refusing to overwrite it."
              exit 1
            fi

            repo_digest="$(docker image inspect "$ref" --format '{{ index .RepoDigests 0 }}')"
            digest="${repo_digest##*@}"

            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve a valid OCI digest for existing tag $ref."
              exit 1
            fi

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push commit image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=${{ env.IMAGE_TAG }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Resolve published digest
        id: release
        shell: bash
        env:
          EXISTING: ${{ steps.existing.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ "$EXISTING" == "true" ]]; then
            digest="$EXISTING_DIGEST"
          else
            digest="$BUILT_DIGEST"
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published image did not resolve to a valid OCI digest: '$digest'"
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Publish release evidence
        shell: bash
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          IMAGE: ${{ steps.release.outputs.image }}
          GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Kijko UseSend image"
            echo
            echo "- Git commit: \`$GIT_SHA\`"
            echo "- Immutable SHA tag: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- OCI digest: \`$DIGEST\`"
            echo "- Production reference: \`$IMAGE\`"
            echo
            echo "This workflow publishes an image only. Production promotion is manual and follows \`docker/kijko/RELEASES.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
